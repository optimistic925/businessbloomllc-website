<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>Business Bloom | Launch, Fund, Automate and Grow with AI</title>
    <meta name="description" content="Business Bloom helps entrepreneurs launch, strengthen, fund, automate and grow their businesses through one AI-powered operating system." />

    <!-- Open Graph Metadata -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Business Bloom" />
    <meta property="og:title" content="Business Bloom | Launch, Fund, Automate and Grow with AI" />
    <meta property="og:description" content="Business Bloom helps entrepreneurs launch, strengthen, fund, automate and grow their businesses through one AI-powered operating system." />
    <meta property="og:url" content="https://businessbloomllc.com" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Preserve the authored customer-facing VET label casing in rendered output.
      const preserveVetLabelCasing = () => {
        for (const node of document.querySelectorAll("p")) {
          if (node.textContent?.trim() === "Meet Your Virtual Executive Team") {
            node.style.textTransform = "none";
          }
        }
      };
      new MutationObserver(preserveVetLabelCasing).observe(document.documentElement, { childList: true, subtree: true });
      preserveVetLabelCasing();
    </script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
