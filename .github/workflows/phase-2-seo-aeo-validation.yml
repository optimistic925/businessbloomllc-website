name: Phase 2 SEO AEO Validation

on:
  push:
    branches:
      - feature/seo-aeo-recovery
  workflow_dispatch:

jobs:
  validate:
    name: Phase 2 Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Automated tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Install rendered QA tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils unzip
          mkdir -p /tmp/business-bloom-rendered-qa
          cd /tmp/business-bloom-rendered-qa
          npm init -y >/dev/null 2>&1
          npm install --package-lock=false playwright@1.55.0 axe-core@4.10.3
          ./node_modules/.bin/playwright install --with-deps chromium
          cd "$GITHUB_WORKSPACE"
          ln -s /tmp/business-bloom-rendered-qa/node_modules/playwright node_modules/playwright
          ln -s /tmp/business-bloom-rendered-qa/node_modules/playwright-core node_modules/playwright-core
          ln -s /tmp/business-bloom-rendered-qa/node_modules/axe-core node_modules/axe-core

      - name: Start production build
        run: |
          mkdir -p qa-artifacts
          nohup env NODE_ENV=production PORT=4173 STRIPE_SECRET_KEY=sk_test_phase_2_validation_only node dist/index.js >/tmp/business-bloom-server.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/business-bloom-server.log
          exit 1

      - name: Existing rendered hard-gate QA
        id: rendered_hard_gate
        continue-on-error: true
        run: node scripts/rendered-hard-gate-qa.mjs

      - name: Route metadata / canonical / robots / sitemap / structured-data QA
        id: seo_aeo_gate
        continue-on-error: true
        run: node scripts/seo-aeo-validation.mjs

      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-2-seo-aeo-qa
          path: qa-artifacts
          if-no-files-found: warn

      - name: Enforce all validation gates
        if: always()
        run: |
          if [ "${{ steps.rendered_hard_gate.outcome }}" != "success" ]; then
            echo "Rendered hard-gate QA failed"
            exit 1
          fi
          if [ "${{ steps.seo_aeo_gate.outcome }}" != "success" ]; then
            echo "SEO/AEO route validation failed"
            exit 1
          fi
          echo "All Phase 2 validation gates passed"
